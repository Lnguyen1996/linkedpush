services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linkedpush_dev
      POSTGRES_USER: lamnguyen
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamnguyen -d linkedpush_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=linkedpush_dev;Username=lamnguyen;Password="
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:8000"
      DevMode: "false"
      FrontendUrl: "http://localhost:3000"
      LinkedIn__RedirectUri: "http://localhost:3000/api/auth/callback"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
